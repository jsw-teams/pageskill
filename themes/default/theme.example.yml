# Reference for a site instance file selected by config.yml: theme.config.
# Component code owns defaults and schemas; site/theme.yml should contain only
# the values this site overrides. A reusable theme package keeps each site's
# instance data in site/theme.yml.
components:
  shell:
    enabled: true
    navigation:
      enabled: true
      before: []
      after: []
    footer:
      enabled: true
      before: []
      after: []
  search:
    enabled: true
    maxResults: 8
    shardSize: 500
    # Optional presentation overrides are schema-bounded; localized messages
    # remain owned by the Component.
  toc:
    enabled: true
    maxDepth: 3
  postMeta:
    enabled: true
    wordCount: true
    readingTime: true
    updateDate: true
    updateNotice: true
    wordsPerMinute: 220
    cjkCharactersPerMinute: 400
  codeCopy:
    enabled: true
  # Consent UI has no required instance options. Configure real provider
  # adapters in config.yml under integrations instead of this theme file.
