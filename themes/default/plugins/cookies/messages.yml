  zh-tw:
    cookieConsent:
      title: Cookie 偏好設定
      description: 選擇哪些可選類別可以運作；必要功能不用於廣告或追蹤
      bannerLabel: 隱私選擇
      settingsLabel: Cookie 設定
      acceptLabel: 接受可選項目
      rejectLabel: 僅必要項目
      saveLabel: 儲存選擇
      closeLabel: 關閉
      essentialLabel: 必要功能
