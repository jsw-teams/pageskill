messages:
  zh-sg:
    cookieConsent:
      title: Cookie 偏好设置
      description: 选择哪些可选用途可以工作；必要功能不用于广告或追踪
      bannerLabel: 隐私选择
      settingsLabel: Cookie 设置
      acceptLabel: 接受可选项
      rejectLabel: 仅必要项
      saveLabel: 保存选择
      closeLabel: 关闭
      essentialLabel: 必要功能
      essentialDescription: 保存你的选择；不启用追踪。
      optionalLabel: 可选用途
      optionalDescription: 默认关闭；只有同意后才可启用。
      policyLabel: 隐私政策
      providerLabel: 提供者
      retentionLabel: 保存期限
      retentionSession: 会话期间
      categories:
        - purpose: essential
          provider: Pageskill
          label: 必要功能
          description: 保存你的 Cookie 选择；不用于广告或追踪。
        - purpose: measurement
          provider: 未配置第三方服务
          label: 可选访问量测量
          description: Google Analytics、Cloudflare Web Analytics 或百度统计只有在主动同意后才可测量访问量。
        - purpose: advertising
          provider: 未配置广告服务
          label: 可选广告
          description: 只有主动同意后才允许广告或转化衡量服务。
        - purpose: fraud-prevention
          provider: 未配置人机验证服务
          label: 反滥用与人机验证
          description: reCAPTCHA、hCaptcha 或 Turnstile 只有在主动同意后才可执行挑战或反滥用检查。
        - purpose: social-embedding
          provider: 未配置社交嵌入
          label: 社交内容
          description: 只有主动同意后才允许 X 等第三方社交内容嵌入。
  zh-tw:
    cookieConsent:
      title: Cookie 偏好設定
      description: 選擇哪些可選用途可以運作；必要功能不用於廣告或追蹤
      bannerLabel: 隱私選擇
      settingsLabel: Cookie 設定
      acceptLabel: 接受可選項目
      rejectLabel: 僅必要項目
      saveLabel: 儲存選擇
      closeLabel: 關閉
      essentialLabel: 必要功能
      essentialDescription: 儲存你的選擇；不啟用追蹤。
      optionalLabel: 可選用途
      optionalDescription: 預設關閉；只有同意後才可啟用。
      policyLabel: 隱私政策
      providerLabel: 提供者
      retentionLabel: 保存期限
      retentionSession: 工作階段
      categories:
        - purpose: essential
          provider: Pageskill
          label: 必要功能
          description: 儲存你的 Cookie 選擇；不用於廣告或追蹤。
        - purpose: measurement
          provider: 未設定第三方服務
          label: 可選訪問量測量
          description: Google Analytics、Cloudflare Web Analytics 或百度統計只有在主動同意後才可測量訪問量。
        - purpose: advertising
          provider: 未設定廣告服務
          label: 可選廣告
          description: 廣告或轉換衡量服務只有在主動同意後才可啟用。
        - purpose: fraud-prevention
          provider: 未設定人機驗證服務
          label: 反濫用與人機驗證
          description: reCAPTCHA、hCaptcha 或 Turnstile 只有在主動同意後才可執行挑戰或反濫用檢查。
        - purpose: social-embedding
          provider: 未設定社交嵌入
          label: 社交內容
          description: X 等第三方社交內容嵌入只有在主動同意後才可啟用。
  en:
    cookieConsent:
      title: Cookie preferences
      description: Choose which optional purposes may run; essential functions are not used for advertising or tracking.
      bannerLabel: Privacy choices
      settingsLabel: Cookie settings
      acceptLabel: Accept optional
      rejectLabel: Essential only
      saveLabel: Save choices
      closeLabel: Close
      essentialLabel: Essential
      essentialDescription: Stores your choice; does not enable tracking.
      optionalLabel: Optional purposes
      optionalDescription: Off by default; enabled only after consent.
      policyLabel: Privacy policy
      providerLabel: Provider
      retentionLabel: Retention
      retentionSession: Session
      categories:
        - purpose: essential
          provider: Pageskill
          label: Essential
          description: Stores your Cookie choice; it is not used for advertising or tracking.
        - purpose: measurement
          provider: No third-party service configured
          label: Optional audience measurement
          description: Google Analytics, Cloudflare Web Analytics, or Baidu Tongji may measure visits only after an affirmative choice.
        - purpose: advertising
          provider: No advertising service configured
          label: Optional advertising
          description: Advertising or conversion measurement may run only after an affirmative choice and only when configured.
        - purpose: fraud-prevention
          provider: No human-verification service configured
          label: Fraud prevention and human verification
          description: reCAPTCHA, hCaptcha, or Turnstile may run challenges or anti-abuse checks only after an affirmative choice.
        - purpose: social-embedding
          provider: No social embeds configured
          label: Social content
          description: X and other third-party social embeds may run only after an affirmative choice and only when configured.
