  en:
    cookieConsent:
      title: Cookie preferences
      description: Choose which optional categories may run; essential functions are not used for advertising or tracking.
      bannerLabel: Privacy choices
      settingsLabel: Cookie settings
      acceptLabel: Accept optional
      rejectLabel: Essential only
      saveLabel: Save choices
      closeLabel: Close
      essentialLabel: Essential
      essentialDescription: Stores your choice; does not enable tracking.
      optionalLabel: Optional
      optionalDescription: Off by default; enabled only after consent.
      policyLabel: Privacy policy
      categories:
        - id: essential
          provider: Pageskill
          label: Essential
          description: Stores your Cookie choice; it is not used for advertising or tracking.
        - id: analytics
          provider: No third-party service configured
          label: Optional analytics
          description: Analytics may run only after an affirmative choice and only when configured.
        - id: advertising
          provider: No advertising service configured
          label: Optional advertising
          description: Advertising or conversion measurement may run only after an affirmative choice and only when configured.
