plugins:
  chrome:
    enabled: true
    navigation:
      enabled: true
      before: []
      after: []
    footer:
      enabled: true
      before: []
      after: []
  search:
    enabled: true
    provider: Pageskill
    maxResults: 8
    shardSize: 500
    # Optional localized labels; untranslated keys fall back to messages.yml.
    copy: {}
  toc:
    enabled: true
    maxDepth: 3
    # Example: copy.zh-sg.title changes only this plugin's wording.
    copy: {}
  privacyConsent:
    enabled: true
    provider: Pageskill
    storage: cookie
    retentionDays: 365
    categories:
      - purpose: essential
        required: true
        default: true
        retentionDays: 365
      - purpose: measurement
        required: false
        default: false
        retentionDays: 0
      - purpose: advertising
        required: false
        default: false
        retentionDays: 0
      - purpose: fraud-prevention
        required: false
        default: false
        retentionDays: 0
      - purpose: social-embedding
        required: false
        default: false
        retentionDays: 0
    # The purpose is registered by the provider adapter; identifier fields
    # are copied from that provider's dashboard or official snippet.
    integrations:
      - provider: google-analytics
        enabled: false
        measurementId: ''
        purpose: measurement
      - provider: google-ads
        enabled: false
        tagId: ''
        purpose: advertising
      - provider: cloudflare-web-analytics
        enabled: false
        token: ''
        purpose: measurement
      - provider: baidu-tongji
        enabled: false
        siteSignature: ''
        purpose: measurement
      - provider: recaptcha
        enabled: false
        siteKey: ''
        purpose: fraud-prevention
      - provider: hcaptcha
        enabled: false
        siteKey: ''
        purpose: fraud-prevention
      - provider: turnstile
        enabled: false
        siteKey: ''
        purpose: fraud-prevention
      - provider: x-for-websites
        enabled: false
        purpose: social-embedding
    gatedScripts: []
    # Optional localized consent labels/purposes; code keeps provider
    # capability registration in plugins/cookies/index.ts.
    copy: {}
