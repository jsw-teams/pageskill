plugins:
  chrome:
    enabled: true
    navigation:
      enabled: true
      before: []
      after: []
    footer:
      enabled: true
      before: []
      after: []
  search:
    enabled: true
    provider: Pageskill
    maxResults: 8
    shardSize: 500
  toc:
    enabled: true
    maxDepth: 3
  privacyConsent:
    enabled: true
    provider: Pageskill
    storage: cookie
    retentionDays: 365
    categories:
      - id: essential
        required: true
        default: true
        retentionDays: 365
      - id: analytics
        required: false
        default: false
        retentionDays: 0
      - id: advertising
        required: false
        default: false
        retentionDays: 0
      - id: security
        required: false
        default: false
        retentionDays: 0
      - id: social
        required: false
        default: false
        retentionDays: 0
    integrations:
      googleAnalytics:
        enabled: false
        measurementId: ''
        category: analytics
      googleAds:
        enabled: false
        conversionId: ''
        category: advertising
      cloudflareWebAnalytics:
        enabled: false
        token: ''
        category: analytics
      baiduTongji:
        enabled: false
        siteId: ''
        category: analytics
      captcha:
        - enabled: false
          platform: recaptcha
          siteKey: ''
          category: security
        - enabled: false
          platform: hcaptcha
          siteKey: ''
          category: security
        - enabled: false
          platform: turnstile
          siteKey: ''
          category: security
      x:
        enabled: false
        category: social
    gatedScripts: []
