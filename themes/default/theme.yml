plugins:
  chrome:
    enabled: true
    navigation:
      enabled: true
      before: []
      after: []
    footer:
      enabled: true
      before: []
      after: []
  search:
    enabled: true
    provider: Pageskill
    maxResults: 8
    shardSize: 500
    # Optional localized labels; untranslated keys fall back to messages.yml.
    copy: {}
  toc:
    enabled: true
    maxDepth: 3
    # Example: copy.zh-sg.title changes only this plugin's wording.
    copy: {}
  privacyConsent:
    enabled: true
    provider: Pageskill
    storage: cookie
    retentionDays: 365
    categories:
      - id: essential
        required: true
        default: true
        retentionDays: 365
      - id: analytics
        required: false
        default: false
        retentionDays: 0
      - id: advertising
        required: false
        default: false
        retentionDays: 0
      - id: security
        required: false
        default: false
        retentionDays: 0
      - id: social
        required: false
        default: false
        retentionDays: 0
    # Each provider value is the real adapter name used by its web service;
    # the identifier fields are copied from that provider's dashboard/snippet.
    integrations:
      - provider: google-analytics
        enabled: false
        measurementId: ''
        category: analytics
      - provider: google-ads
        enabled: false
        tagId: ''
        category: advertising
      - provider: cloudflare-web-analytics
        enabled: false
        token: ''
        category: analytics
      - provider: baidu-tongji
        enabled: false
        siteSignature: ''
        category: analytics
      - provider: recaptcha
        enabled: false
        siteKey: ''
        category: security
      - provider: hcaptcha
        enabled: false
        siteKey: ''
        category: security
      - provider: turnstile
        enabled: false
        siteKey: ''
        category: security
      - provider: x-for-websites
        enabled: false
        category: social
    gatedScripts: []
    # Optional localized consent labels/categories; code keeps provider
    # capability registration in plugins/cookies/index.ts.
    copy: {}
