plugins:
  language:
    enabled: true
  search:
    enabled: true
    provider: Pageskill
    maxResults: 8
    shardSize: 500
  toc:
    enabled: true
    maxDepth: 3
  privacyConsent:
    enabled: true
    provider: Pageskill
    storage: cookie
    retentionDays: 365
    categories:
      - id: essential
        required: true
        default: true
        retentionDays: 365
      - id: analytics
        required: false
        default: false
        retentionDays: 0
      - id: advertising
        required: false
        default: false
        retentionDays: 0
    gatedScripts: []
