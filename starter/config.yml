siteUrl: https://example.com
defaultLocale: en
activeLocales:
  - zh-sg
  - zh-tw
  - en
siteName:
  zh-sg: 我的 Pageskill 网站
  zh-tw: 我的 Pageskill 網站
  en: My Pageskill Site
description:
  zh-sg: 用 Markdown 编写页面和文章，发布一个小网站。
  zh-tw: 用 Markdown 編寫頁面和文章，發佈一個小網站。
  en: Write pages and articles in Markdown and publish a small site.
theme:
  name: default
  nav:
    links:
      - key: home
        href: /:locale/
      - key: posts
        href: /:locale/posts/
content:
  collections:
    pages:
      contentType: page
      pattern: document
      route: /:locale/:id/
      schema:
        title:
          type: string
          required: true
        description: string
        pattern: string
    posts:
      contentType: post
      pattern: blog
      route: /:locale/posts/:id/
      feed: true
      archive: true
      orderBy: date:desc
      schema:
        title:
          type: string
          required: true
        description: string
        date:
          type: string
          required: true
        cover: string
        ogImage: string
        pattern: string
deployment:
  targets: []
