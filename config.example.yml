# The root config stays small. Split optional site policy into files under
# config/ and list them in order; later layers replace arrays and scalars.
extends:
  - ./config/content.yml
  - ./config/discovery.yml

siteUrl: https://example.com
defaultLocale: en
activeLocales:
  - en
siteName: Example
description: A site built with Pageskill.

theme:
  name: default
  config: ./site/theme.yml

navigation:
  links:
    - key: home
      href: /:locale/
    - key: about
      href: /:locale/about/
    - label: GitHub
      href: https://github.com/example/example
      target: _blank

footer:
  links:
    - key: privacy
      href: /:locale/privacy/
    - label: GitHub
      href: https://github.com/example/example
      target: _blank

# Add only services this site actually uses. The active theme's trusted
# adapter registry supplies each provider's purpose, consent, and loader.
# integrations:
#   google-analytics:
#     measurementId: G-XXXXXXXXXX
#   turnstile:
#     siteKey: 0x4AAAA...

# Optional consent policy override. The default is automatic: no consent UI
# appears until a configured adapter requires it.
# privacy:
#   consent:
#     decisionRetentionDays: 180

# Pageskill always emits static files. A Component that declares client.api
# selects one named entry. Third-party URLs are allowed.
# Any token written here is compiled into public browser JavaScript, so use
# only a restricted, revocable client token. Private credentials require a
# separately deployed proxy; point the URL at that proxy and omit token.
# apis:
#   comments:
#     url: https://api.example.com/v1/comments
#     token: public-client-token
#     auth: bearer
# Local search does not belong here: it reads the generated static search
# index through the unified Client Runtime and never calls an external API.
