siteUrl: https://pagekiln.pages.dev
defaultLocale: en
activeLocales:
  - zh-sg
  - zh-tw
  - en
siteName:
  zh-sg: Pageskill
  zh-tw: Pageskill
  en: Pageskill
description:
  zh-sg: 发现并复用 Pattern、Block 与 Schema，用 Markdown 和配置编译可检查的多语言网站，并按需连接同源 API。
  zh-tw: 發現並重用 Pattern、Block 與 Schema，用 Markdown 和設定編譯可檢查的多語言網站，並按需連接同源 API。
  en: Discover and reuse Patterns, Blocks, and schemas; compose inspectable localized sites from Markdown and configuration, with same-origin APIs when needed.
author:
  zh-sg: Site Owner
  zh-tw: Site Owner
  en: Site Owner
theme:
  name: default
  nav:
    links:
      - key: home
        href: /:locale/
      - key: about
        href: /:locale/about/
      - key: guide
        href: /:locale/guide/
      - key: development
        href: /:locale/development/
      - key: posts
        href: /:locale/posts/
    utilityLinks: []

# Site configuration selects built-in capabilities; markup, CSS, and browser code stay in the theme.
plugins:
  search:
    enabled: true
    provider: Pageskill
  privacyConsent:
    enabled: true
    provider: Pageskill

icons:
  favicon: /favicon.ico
  icon32: /favicon-32x32.png
  appleTouchIcon: /apple-touch-icon.png
  icon192: /assets/icon-192.png
  icon512: /assets/icon-512.png
  source: /assets/icon-source.png
  manifest: /site.webmanifest

branding:
  showAttribution: false
  attributionUrl: https://github.com/jsw-teams/pageskill
  attribution:
    zh-sg: Pageskill by JSW Teams
    zh-tw: Pageskill by JSW Teams
    en: Pageskill by JSW Teams

pwa:
  backgroundColor: "#f3f0e8"
  themeColor: "#155b68"

images:
  social: assets/og-default-product.webp
  variants:
    - source: og-default-product-source.png
      output: assets/og-default-product.webp
      width: 1200
      height: 630
      fit: cover
      format: webp
      quality: 82
    - source: product-note-cover-source.png
      output: assets/product-note-cover.webp
      width: 1200
      height: 800
      fit: cover
      format: webp
      quality: 82

robots:
  rules:
    - userAgent: "*"
      allow:
        - /

llms:
  title: Pageskill
  description: A reuse-first static website compiler where people can directly discover and compose localized sites from reusable Patterns, Blocks, schemas, Markdown, and configuration; Agents are optional and per-page HTML is not required.
  full:
    enabled: true
    shardSize: 250

search:
  enabled: true
  maxResults: 8
  shardSize: 500

outputs:
  markdownMirrors: true

archive:
  pageSize: 50
  collection: posts

feed:
  title: Pageskill
  limit: 20
  collection: posts

privacy:
  controller:
    name: Site Owner
    contactUrl: https://github.com/jsw-teams/pageskill
    supervisoryAuthorityUrl: https://edpb.europa.eu/about-edpb/about-edpb_en
  cookieConsent:
    enabled: true
    policyRoute: /:locale/privacy/
    agentRoute: /.well-known/agent.json
    storage: cookie
    retentionDays: 365
    categories:
      - id: essential
        required: true
        default: true
        retentionDays: 365
      - id: analytics
        required: false
        default: false
        retentionDays: 0
      - id: advertising
        required: false
        default: false
        retentionDays: 0
content:
  collections:
    pages:
      contentType: page
      pattern: document
      route: /:locale/:id/
      schema:
        title:
          type: string
          required: true
        description: string
        pattern: string
    posts:
      contentType: post
      pattern: blog
      route: /:locale/posts/:id/
      feed: true
      archive: true
      orderBy: date:desc
      schema:
        title:
          type: string
          required: true
        description: string
        date:
          type: string
          required: true
        cover: string
        ogImage: string
        pattern: string

deployment:
  targets: []
  cloudflare:
    accountId: null
    apiTokenEnv: CLOUDFLARE_API_TOKEN
    pages:
      project: null
      branch: null
    workers:
      name: null
      compatibilityDate: '2026-08-10'
  github:
    remote: null
    branch: null
    tokenEnv: GITHUB_TOKEN
  vps:
    host: null
    user: null
    port: 22
    remotePath: null
    identityFile: null
    publicKeyFile: null
  backend: true
  dynamicRoutes:
    - /api/health
