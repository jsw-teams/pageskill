siteUrl: https://pageskill.openjsu.com
defaultLocale: en
activeLocales:
  - zh-sg
  - zh-tw
  - en
i18n:
  fallbackLocale: en
  contentFallback: true
siteName:
  zh-sg: Pageskill
  zh-tw: Pageskill
  en: Pageskill
description:
  zh-sg: 给刚开始做网站的人：用 Markdown 和清晰的步骤，学习、编写并发布自己的 Pageskill 网站。
  zh-tw: 給剛開始做網站的人：用 Markdown 和清楚的步驟，學習、編寫並發布自己的 Pageskill 網站。
  en: A friendly starting point for building a small website with Markdown, clear steps, and Pageskill.
author:
  zh-sg: toewpq
  zh-tw: toewpq
  en: toewpq
theme:
  name: default

navigation:
  links:
    - key: home
      href: /:locale/
    - key: about
      href: /:locale/about/
    - key: start
      href: /:locale/posts/start/
    - key: posts
      href: /:locale/posts/
    - key: customize
      href: /:locale/posts/customize/
    - key: updates
      href: /:locale/updates/
  utilityLinks: []

icons:
  favicon: /favicon.ico
  icon32: /favicon-32x32.png
  appleTouchIcon: /apple-touch-icon.png
  icon192: /assets/icon-192.png
  icon512: /assets/icon-512.png
  source: /assets/icon-source.png
  manifest: /site.webmanifest

branding:
  showAttribution: false
  attributionUrl: https://github.com/jsw-teams/pageskill
  attribution:
    zh-sg: Pageskill by JSW Teams
    zh-tw: Pageskill by JSW Teams
    en: Pageskill by JSW Teams

pwa:
  backgroundColor: "#faf8f3"
  themeColor: "#244b3d"

images:
  social: assets/og-default-product.webp
  variants:
    - source: og-default-bear-source.png
      output: assets/og-default-product.webp
      width: 1200
      height: 630
      fit: cover
      format: webp
      quality: 82
    - source: product-note-cover-bear-source.png
      output: assets/product-note-cover.webp
      width: 1200
      height: 800
      fit: cover
      format: webp
      quality: 82

robots:
  rules:
    - userAgent: "*"
      allow:
        - /

llms:
  title: Pageskill
  description: A friendly static website compiler that helps beginners turn Markdown and a few clear steps into a localized site; reusable Patterns and Blocks are available when you need them.
  full:
    enabled: true
    shardSize: 250

outputs:
  markdownMirrors: true

archive:
  pageSize: 50
  collections:
    - posts
    - updates

feed:
  title: Pageskill
  limit: 20
  collections:
    - posts
    - updates

privacy:
  controller:
    name: Site Owner
    contactUrl: https://github.com/jsw-teams/pageskill
    supervisoryAuthorityUrl: https://edpb.europa.eu/about-edpb/about-edpb_en
  cookieConsent:
    policyRoute: /:locale/privacy/
    agentRoute: /.well-known/agent.json
content:
  collections:
    pages:
      contentType: page
      pattern: document
      route: /:locale/:id/
      schema:
        title:
          type: string
          required: true
        description: string
        pattern: string
    posts:
      contentType: post
      pattern: blog
      route: /:locale/posts/:id/
      feed: true
      archive: true
      archiveRoute: /:locale/posts/
      orderBy: date:desc
      schema:
        title:
          type: string
          required: true
        description: string
        date:
          type: string
          required: true
        category: string
        author: string
        cover: string
        ogImage: string
        pattern: string
  views:
    updates:
      collection: posts
      category: update
      route: /:locale/updates/:id/
      archiveRoute: /:locale/updates/
      feedRoute: /:locale/updates/feed.xml

deployment:
  targets: []
  cloudflare:
    accountId: null
    apiTokenEnv: CLOUDFLARE_API_TOKEN
    pages:
      project: null
      branch: null
    workers:
      name: null
      compatibilityDate: '2026-08-10'
  github:
    remote: null
    branch: null
    tokenEnv: GITHUB_TOKEN
  vps:
    host: null
    user: null
    port: 22
    remotePath: null
    identityFile: null
    publicKeyFile: null
  backend: true
