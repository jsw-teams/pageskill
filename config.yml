extends:
  - ./config/content.yml
  - ./config/discovery.yml

siteUrl: https://pageskill.openjsu.com
defaultLocale: en
activeLocales:
  - zh-sg
  - zh-tw
  - en
siteName:
  zh-sg: Pageskill
  zh-tw: Pageskill
  en: Pageskill
description:
  zh-sg: 给刚开始做网站的人：用 Markdown 和清晰的步骤，学习、编写并发布自己的 Pageskill 网站。
  zh-tw: 給剛開始做網站的人：用 Markdown 和清楚的步驟，學習、編寫並發布自己的 Pageskill 網站。
  en: A friendly starting point for building a small website with Markdown, clear steps, and Pageskill.
author:
  zh-sg: toewpq
  zh-tw: toewpq
  en: toewpq
theme:
  name: default
  config: ./site/theme.yml

navigation:
  links:
    - key: home
      href: /:locale/
    - key: about
      href: /:locale/about/
    - key: start
      href: /:locale/posts/start/
    - key: posts
      href: /:locale/posts/
    - key: updates
      href: /:locale/updates/
    - label: GitHub
      href: https://github.com/jsw-teams/pageskill
      target: _blank

footer:
  kicker:
    zh-sg: 静态内容工具
    zh-tw: 靜態內容工具
    en: Static content tooling
  note:
    zh-sg: 让内容保持可读，让动态能力留在明确的外部边界。
    zh-tw: 讓內容保持可讀，讓動態能力留在明確的外部邊界。
    en: Keep content readable and dynamic capabilities behind explicit external boundaries.
  links:
    - key: privacy
      href: /:locale/privacy/
    - label: GitHub
      href: https://github.com/jsw-teams/pageskill
      target: _blank

icons:
  favicon: /favicon.ico
  icon32: /favicon-32x32.png
  appleTouchIcon: /apple-touch-icon.png
  icon192: /assets/icon-192.png
  icon512: /assets/icon-512.png
  source: /assets/icon-source.png
  manifest: /site.webmanifest

pwa:
  backgroundColor: "#f7f5f0"
  themeColor: "#14213d"

privacy:
  controller:
    name: toewpq
    contactUrl: https://github.com/jsw-teams/pageskill
    supervisoryAuthorityUrl: https://edpb.europa.eu/about-edpb/about-edpb_en
